<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holler &amp; Hellfire</title>
  <meta name="description" content="Holler &amp; Hellfire">
  <style>
    :root {
      --bg: #14100d;
      --surface: #1f1914;
      --text: #efe6da;
      --muted: #b5a796;
      --accent: #d9622b;
      --border: #3a2f26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 Georgia, "Times New Roman", serif;
    }
    header, main, footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header { padding-top: 72px; padding-bottom: 40px; text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4rem);
      letter-spacing: 0.02em;
    }
    h1 span { color: var(--accent); }
    .tagline { color: var(--muted); font-style: italic; margin-top: 8px; }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    h2 { margin-top: 0; color: var(--accent); font-size: 1.3rem; }
    a { color: var(--accent); }
    footer { color: var(--muted); font-size: 0.9rem; text-align: center; padding-bottom: 48px; }
  </style>
</head>
<body>
  <header>
    <h1>Holler <span>&amp;</span> Hellfire</h1>
    <p class="tagline">Your tagline goes here.</p>
  </header>

  <main>
    <section id="about">
      <h2>About</h2>
      <p>Tell visitors what Holler &amp; Hellfire is about. Replace this paragraph with your own words.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Add an email address or social links here.</p>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> Holler &amp; Hellfire
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
